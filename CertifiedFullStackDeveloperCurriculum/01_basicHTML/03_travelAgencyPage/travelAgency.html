<!--
Fulfill the user stories below and get all the tests to pass to complete the lab.

User Stories:

[x] You should have a DOCTYPE declaration.
[x] You should have an html element with lang set to en.
[x] You should have a head element containing a meta void element with charset set to utf-8 and a title with the text Travel Agency Page.
[x] You should have a meta tag in your head element that contains a short description of your website for SEO.
[x] You should have an h1 element to present your travel destinations.
[x] You should have a paragraph below the h1 element introducing the travel opportunities.
[x] You should have an h2 element with the text Packages.
[x] You should have a p element introducing briefly the various packages.
[x] You should have an unordered list element with two list items. The two list items should have the text Group Travels and Private Tours, respectively. The text of each list item should be enclosed by an anchor element.
[x] You should have an h2 element with the text Top Itineraries.
[x] You should have at least three figure elements, each containing an anchor element and a figcaption element.
[x] The three anchor elements should have an img element with an appropriate alt attribute and a src attribute set to a valid image as their content. You can use https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg, https://cdn.freecodecamp.org/curriculum/labs/alps.jpg, and https://cdn.freecodecamp.org/curriculum/labs/sea.jpg if you would like.
[x] All your five anchor elements should have an href attribute with the value of https://www.freecodecamp.org/learn and a target attribute with the value of _blank.
-->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta 
			name="description"
			content="A travel agency page built for the Free Code Camp lab."
		/>
		<title>Travel Agency Page</title>
	</head>
	<body>
		<h1>Travel Destinations</h1>
		
		<p>Have you ever wanted to go somewhere? Pay me, and I can help you pay other people to make that happen.</p>
		
		<h2>Packages</h2>
		
		<p>There are different packages, contact me to learn about them.</p>
		
		<ul>
			<li><a href="https://www.freecodecamp.org/learn" target="_blank">Group Travels</a></li>
			<li><a href="https://www.freecodecamp.org/learn" target="_blank">Private Tours</a></li>
		</ul>
		
		<h2>Top Itineraries</h2>
		
		<figure>
			<a href="https://www.freecodecamp.org/learn" target="_blank"><img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="Destination 1"></a>
			<figcaption>Destination 1</figcaption>
		</figure>
		
		<figure>
			<a href="https://www.freecodecamp.org/learn" target="_blank"><img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="Destination 2"></a>
			<figcaption>Destination 2</figcaption>
		</figure>
		
		<figure>
			<a href="https://www.freecodecamp.org/learn" target="_blank"><img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="Destination 3"></a>
			<figcaption>Destination 3</figcaption>
		</figure>
	</body>
</html>
